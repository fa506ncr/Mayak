<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mayak — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
  </script>
</head>
<body>
  <div id="bg" aria-hidden="true"></div>

  <header class="header">
    <div class="header-inner">
      <div class="logo"><span class="logo-dot"></span>Mayak</div>
      <div class="userbox">
        <span id="avatar" class="avatar is-guest" title="гость">
          <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="18" fill="#2a3444"/><circle cx="18" cy="14" r="6" fill="#8b95a7"/><path d="M6 30c1.5-6 6-9 12-9s10.5 3 12 9" fill="#8b95a7"/></svg>
          <b id="avatar-letter">?</b>
        </span>
        <span id="greeting" class="greeting">Здравствуйте, гость</span>
        <button id="btn-auth-open" class="btn-login">Войти</button>
        <button id="btn-logout" class="btn-ghost hidden">Выйти</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="auth-modal" class="modal hidden">
      <div class="modal-card">
        <div class="modal-title">Вход / Регистрация</div>
        <div class="modal-sub">Только почта и пароль. Любая почта, без имён.</div>
        <input id="email" type="email" placeholder="почта" autocomplete="email" />
        <input id="password" type="password" placeholder="пароль (мин. 8)" autocomplete="current-password" />
        <div class="modal-row">
          <button id="btn-login" class="btn-primary">Войти</button>
          <button id="btn-signup" class="btn-ghost">Создать аккаунт</button>
        </div>
        <div id="auth-msg" class="msg"></div>
        <button id="btn-auth-close" class="modal-x" aria-label="закрыть">✕</button>
      </div>
    </section>

    <div class="bento">
      <button class="card xl" data-go="chats">
        <span class="card-top"><span class="card-ico">✉</span><span class="badge">3</span></span>
        <span class="card-title">Чаты</span>
        <span class="chat-list">
          <span class="chat"><i style="background:#5b8cff">A</i><span><b>anon_fox</b><s>видел маяк сегодня?</s></span><em>2м</em></span>
          <span class="chat"><i style="background:#22b07d">K</i><span><b>user_91ab</b><s>скинул трек в ленту</s></span><em>14м</em></span>
        </span>
      </button>

      <button class="card wide" data-go="feed">
        <span class="card-top"><span class="card-ico">◈</span><span class="pill">тренд</span></span>
        <span class="card-title">Лента</span>
        <span id="feed-preview" class="feed-preview">Ночной город шумит, а маяк молчит. Анонимный пост #128: «тишина — тоже сигнал» · ♥ 214</span>
      </button>

      <button class="card tall" data-go="account">
        <span class="card-top"><span class="card-ico">●</span></span>
        <span class="card-title">Аккаунт</span>
        <span id="account-preview" class="account-preview">Войди, чтобы взять уникальный ник.</span>
      </button>

      <button class="card" data-go="communities">
        <span class="card-top"><span class="card-ico">◎</span></span>
        <span class="card-title">Сообщества</span>
        <span class="avatars"><i style="background:#7c5cff">M</i><i style="background:#0ea5a0">N</i><i style="background:#f26d3d">W</i><em>+12</em></span>
      </button>

      <button class="card" data-go="settings">
        <span class="card-top"><span class="card-ico">⚙</span></span>
        <span class="card-title">Настройки</span>
        <span class="card-sub">тема · приватность</span>
      </button>

      <button class="card" data-go="safety">
        <span class="card-top"><span class="card-ico">⬢</span></span>
        <span class="card-title">Безопасность</span>
        <span class="card-sub">анонимность по умолчанию</span>
      </button>
    </div>

    <section id="account-panel" class="sheet hidden">
      <div class="sheet-title">Аккаунт</div>
      <div class="sheet-sub">Ник уникален — занятый взять нельзя.</div>
      <input id="nick" maxlength="20" placeholder="nick" />
      <div id="nick-status" class="msg"></div>
      <input id="bio" maxlength="160" placeholder="о себе" />
      <div class="sheet-row"><button id="btn-save" class="btn-primary">Сохранить</button></div>
      <div id="acc-msg" class="msg"></div>
    </section>
    <div id="stub" class="sheet hidden"></div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>

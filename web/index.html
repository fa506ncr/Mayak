<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mayak — Start</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
  </script>
</head>
<body>
  <div id="bg"></div>
  <header class="metro-top">
    <div class="metro-title">Mayak</div>
    <div class="metro-user">
      <span id="greeting">Здравствуйте, гость</span>
      <span class="userpic"></span>
      <button id="btn-auth-open" class="mbtn">Войти</button>
      <button id="btn-logout" class="mbtn hidden">Выйти</button>
    </div>
  </header>

  <main class="metro-scroll">
    <section id="auth-panel" class="metro-auth hidden">
      <div class="auth-title">Вход / Регистрация</div>
      <div class="auth-sub">Только почта и пароль. Любая почта.</div>
      <input id="email" type="email" placeholder="почта" autocomplete="email" />
      <input id="password" type="password" placeholder="пароль" autocomplete="current-password" />
      <div class="auth-row">
        <button id="btn-login" class="mbtn">Войти</button>
        <button id="btn-signup" class="mbtn solid">Создать аккаунт</button>
      </div>
      <div id="auth-msg" class="msg"></div>
    </section>

    <div class="group">
      <div class="group-title">Главная</div>
      <div class="tiles">
        <button class="tile wide c-blue" data-go="chats">
          <span class="t-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16v11H9l-5 4V4z" fill="none" stroke="white" stroke-width="1.6"/><circle cx="9" cy="9.5" r="1" fill="white"/><circle cx="12.5" cy="9.5" r="1" fill="white"/><circle cx="16" cy="9.5" r="1" fill="white"/></svg></span>
          <span class="t-label">Чаты</span>
        </button>
        <button class="tile c-green" data-go="feed">
          <span class="t-icon"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" fill="none" stroke="white" stroke-width="1.6"/><line x1="8" y1="8" x2="16" y2="8" stroke="white" stroke-width="1.4"/><line x1="8" y1="11" x2="16" y2="11" stroke="white" stroke-width="1.4"/><line x1="8" y1="14" x2="13" y2="14" stroke="white" stroke-width="1.4"/></svg></span>
          <span class="t-label">Лента</span>
        </button>
        <button class="tile c-orange" data-go="communities">
          <span class="t-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3" fill="none" stroke="white" stroke-width="1.6"/><circle cx="16.5" cy="9.5" r="2.4" fill="none" stroke="white" stroke-width="1.4"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" fill="none" stroke="white" stroke-width="1.6"/><path d="M14.5 14.6c2.8.2 5 2 5 4.4" fill="none" stroke="white" stroke-width="1.4"/></svg></span>
          <span class="t-label">Сообщества</span>
        </button>
        <button class="tile wide c-violet" data-go="account">
          <span class="t-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="white" stroke-width="1.6"/><path d="M5.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" fill="none" stroke="white" stroke-width="1.6"/></svg></span>
          <span class="t-label">Аккаунт</span>
        </button>
        <button class="tile c-teal" data-go="settings">
          <span class="t-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="white" stroke-width="1.6"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" stroke="white" stroke-width="1.6"/></svg></span>
          <span class="t-label">Настройки</span>
        </button>
        <button class="tile c-red" data-go="safety">
          <span class="t-icon"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.2 8-7 10-3.8-2-7-5-7-10V6l7-3z" fill="none" stroke="white" stroke-width="1.6"/></svg></span>
          <span class="t-label">Безопасность</span>
        </button>
      </div>

      <section id="account-panel" class="metro-auth hidden">
        <div class="auth-title">Аккаунт</div>
        <input id="nick" maxlength="20" placeholder="nick" />
        <input id="bio" maxlength="160" placeholder="о себе" />
        <div class="auth-row"><button id="btn-save" class="mbtn solid">Сохранить</button></div>
        <div id="acc-msg" class="msg"></div>
      </section>
      <div id="stub" class="metro-auth hidden"></div>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>

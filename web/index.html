<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mayak — Start</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="./index.html">
      <svg class="mark" viewBox="0 0 32 40" aria-hidden="true"><path d="M13 3h6v4h-6z" fill="#fff"/><path d="M11 7h10l2 24H9L11 7z" fill="#fff"/><rect x="11.6" y="12" width="8.8" height="3.4" fill="#001830"/><rect x="10.8" y="19" width="10.4" height="3.4" fill="#001830"/><rect x="10" y="26" width="12" height="3.4" fill="#001830"/><rect x="6" y="33" width="20" height="3" fill="#fff"/><path d="M19 8l9-3-1 3-8 2zM13 8l-9-3 1 3 8 2z" fill="#fff"/></svg>
      <span>Mayak</span>
    </a>
    <div class="user">
      <span id="greeting">Здравствуйте, гость</span>
      <button id="btn-auth-open" class="login">Войти</button>
      <button id="btn-logout" class="login hidden">Выйти</button>
    </div>
  </header>

  <main class="wrap">
    <section id="auth-panel" class="auth hidden">
      <div class="auth-title">Вход / Регистрация</div>
      <div class="auth-sub">Только почта и пароль. Любая почта.</div>
      <input id="email" type="email" placeholder="почта" autocomplete="email" />
      <input id="password" type="password" placeholder="пароль" autocomplete="current-password" />
      <div class="auth-row">
        <button id="btn-login" class="login">Войти</button>
        <button id="btn-signup" class="login">Создать аккаунт</button>
      </div>
      <div id="auth-msg" class="msg"></div>
    </section>

    <div class="group">Главная</div>
    <nav class="tiles">
      <a class="tile t-chats" href="./chats.html">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M4 4h16v11H9l-5 4V4z" fill="none" stroke="#ffffff" stroke-width="1.8"/><circle cx="9" cy="9.5" r="1" fill="#ffffff"/><circle cx="12.5" cy="9.5" r="1" fill="#ffffff"/><circle cx="16" cy="9.5" r="1" fill="#ffffff"/></svg></span>
        <span class="label">Чаты</span>
      </a>
      <a class="tile t-feed" href="./feed.html">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" fill="none" stroke="#ffffff" stroke-width="1.8"/><line x1="8" y1="8" x2="16" y2="8" stroke="#ffffff" stroke-width="1.6"/><line x1="8" y1="11" x2="16" y2="11" stroke="#ffffff" stroke-width="1.6"/><line x1="8" y1="14" x2="13" y2="14" stroke="#ffffff" stroke-width="1.6"/></svg></span>
        <span class="label">Лента</span>
      </a>
      <a class="tile t-comm" href="./communities.html">
        <span class="ico"><svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3" fill="none" stroke="#ffffff" stroke-width="1.8"/><circle cx="16.5" cy="9.5" r="2.4" fill="none" stroke="#ffffff" stroke-width="1.6"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5" fill="none" stroke="#ffffff" stroke-width="1.8"/></svg></span>
        <span class="label">Сообщества</span>
      </a>
      <a class="tile wide t-acc" href="./account.html">
        <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="#ffffff" stroke-width="1.8"/><path d="M5.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" fill="none" stroke="#ffffff" stroke-width="1.8"/></svg></span>
        <span class="label">Аккаунт</span>
      </a>
      <a class="tile t-set" href="./settings.html">
        <span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="#ffffff" stroke-width="1.8"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" stroke="#ffffff" stroke-width="1.8"/></svg></span>
        <span class="label">Настройки</span>
      </a>
      <a class="tile t-sec" href="./safety.html">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.2 8-7 10-3.8-2-7-5-7-10V6l7-3z" fill="none" stroke="#ffffff" stroke-width="1.8"/></svg></span>
        <span class="label">Безопасность</span>
      </a>
    </nav>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
